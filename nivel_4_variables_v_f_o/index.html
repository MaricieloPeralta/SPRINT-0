<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
    <title>CENTRAL</title>
</head>

<body>
    <h1>Menú del Restaurante</h1>

    <button id="btnMostrar">Mostrar menú</button>
    <button id="btnAgregar">Agregar plato demo</button>

    <div id="output"></div>
    <hr>

    <h2>Herramientas</h2>

    <input id="inputBuscar" placeholder="Buscar plato por nombre" />
    <button id="btnBuscar">Buscar</button>

    <button id="btnStockBajo">Ver stock bajo (&lt;= 3)</button>

    <button id="btnResumen">Ver resumen</button>
    <div id="output2"></div>

    <hr>
    <h2>Tiendita Virtual</h2>
    <p>Bienvenido a la tiendita virtual de Central!!!
        <br>Compra aquí ingresando el plato que deseas y luego su cantidad.
    </p>
    <label for="inputBuscarTiendita">Buscar plato:</label>
    <input id="inputBuscarTiendita" />
    <button id="btnBuscarTiendita">Buscar</button>
    <br>
    <div id="outputTiendita"></div>
    <br>
    <div id="output3" style="display: none;">
        <label for="inputCantidad">Cantidad:</label>
        <input id="inputCantidad" type="number" />
        <button id="btnComprar">Comprar</button>
        <br>
    </div>

    <button id="btnMostrarMenuDeNuevo" style="display:none">Finalizar Compra</button>
    <br>
    <script type="module" src="./main.js"></script>
</body>

</html>
